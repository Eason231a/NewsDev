server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/heima_news?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: heima-news-jwt-secret-key-2026-must-be-at-least-256-bits-long
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

upload:
  mode: local
  local-path: ./uploads
  allowed-extensions: jpg,jpeg,png
